name: Refresh catalog

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull SeaTable and audit
        run: python3 scripts/refresh_catalog.py
      - name: Commit catalog if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.jsonl data/meta.json data/audit.md data/overrides.jsonl data/missing.jsonl data/discovered-urls.jsonl
          git rm -f --ignore-unmatch data/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog is already up to date"
            exit 0
          fi
          git commit -m "Refresh SeaTable catalog"
          git push
